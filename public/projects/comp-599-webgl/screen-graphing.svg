<title id="hr-t">WebGL Academic Presentation: 3D Mathematical Graphing slide</title>
<desc id="hr-d">Product shot of slide 2 of 6 in a dark browser window: the 400px sidebar with the 02. Mathematical Precision kicker, the 3D Mathematical Graphing title, description, Select Equation dropdown set to 3D Spiral (Helix), arrow bullets and Back / 2 / 6 / Next, beside the white Three.js stage with its grid helper, red, green and blue axes with X, Y and Z labels, the gold helix x = cos(2t), y = t, z = sin(2t) and the Equation legend.</desc>
