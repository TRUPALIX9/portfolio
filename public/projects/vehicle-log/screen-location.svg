<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="glo-t glo-d">
  <title id="glo-t">Gatelog Server Setup - install location</title>
  <desc id="glo-d">The Gatelog installer step before the install starts, in a Windows 11 window: the title Please Select Installation Location, the Installation Location text box set to C:\Program Files with a folder browse button, and a blue Continue button. Progress and logs stay hidden until Continue is clicked.</desc>
  <defs>
    <linearGradient id="glo-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#262F38"/><stop offset="1" stop-color="#171C21"/></linearGradient><radialGradient id="glo-glow" cx="50%" cy="46%" r="52%"><stop offset="0" stop-color="#F2C200" stop-opacity="0.16"/><stop offset="1" stop-color="#F2C200" stop-opacity="0"/></radialGradient><clipPath id="glo-win"><rect x="40" y="40" width="1200" height="720" rx="8"/></clipPath>
    <filter id="glo-shadow" x="-10%" y="-10%" width="120%" height="125%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#2A2410" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1280" height="800" fill="#F3F1EA"/>
  <rect x="40" y="40" width="1200" height="720" rx="8" fill="#FFFFFF" filter="url(#glo-shadow)"/>
  <g clip-path="url(#glo-win)">
      <rect x="40" y="40" width="1200" height="720" fill="#FFFFFF"/>

      <!-- Form1 title bar (custom, rebranded) -->
      <rect x="40" y="40" width="1200" height="32" fill="#171C21"/>
      <g transform="translate(52 45) scale(0.04297)"><rect width="512" height="512" rx="112" fill="url(#glo-bg)"/><circle cx="256" cy="250" r="230" fill="url(#glo-glow)"/><g transform="translate(88 88) scale(14)"><rect x="11.2" y="12.6" width="9.6" height="1.9" rx="0.95" fill="#F2C200"/><rect x="11.2" y="16.1" width="7.2" height="1.9" rx="0.95" fill="#E9EDF0" fill-opacity="0.85"/><rect x="11.2" y="19.6" width="9.6" height="1.9" rx="0.95" fill="#E9EDF0" fill-opacity="0.85"/><g transform="translate(6 10.2) rotate(-29)"><rect x="-1.2" y="-1.55" width="15.6" height="3.1" rx="1.55" fill="#F2C200"/><rect x="4.2" y="-1.55" width="2.3" height="3.1" fill="#171C21"/><rect x="9.1" y="-1.55" width="2.3" height="3.1" fill="#171C21"/></g><rect x="4.4" y="10.2" width="3.2" height="10.6" rx="1" fill="#E9EDF0"/><rect x="3" y="19.6" width="6" height="1.9" rx="0.95" fill="#E9EDF0"/><circle cx="6" cy="10.2" r="2.35" fill="#E9EDF0"/><circle cx="6" cy="10.2" r="0.95" fill="#171C21"/></g></g>
      <text x="84" y="62.5" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#F0FFF0">Gatelog Server Setup</text>
      <g stroke="#F0FFF0" stroke-width="1.1" fill="none">
        <path d="M1120 56.5h10"/>
        <rect x="1166.5" y="51.5" width="9" height="9" rx="1.5" stroke-opacity="0.35"/>
      </g>
      <path d="M1212 51l10 10M1222 51l-10 10" stroke="#F0FFF0" stroke-width="1.1" fill="none"/>

      <!-- MainPanel (FixedSingle) hosting InstallerControl, initial state (progress, step and logs hidden) -->
      <rect x="40.5" y="72.5" width="1199" height="653" fill="#FFFFFF" stroke="#A0A0A0"/>

      <!-- lbl_title -->
      <text x="640" y="113" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="25" fill="#000000">Please Select Installation Location</text>

      <!-- panel_installtion: label, enabled textBox1, folder button -->
      <text x="88" y="243" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="25" fill="#000000">Installation Location</text>
      <rect x="365.5" y="218.5" width="779" height="32" fill="#FFFFFF" stroke="#7A7A7A"/>
      <path d="M366 250.5h778" stroke="#0078D7" stroke-width="2"/>
      <text x="372" y="240.5" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#000000">C:\Program Files</text>
      <path d="M494.5 224v21" stroke="#000000" stroke-width="1"/>
      <rect x="1149.5" y="217.5" width="54" height="34" rx="2" fill="#E1E1E1" stroke="#ADADAD"/>
      <text x="1176.5" y="239.5" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#000000">...</text>

      <!-- btn_continue_finish: KryptonButton, SystemColors.Highlight -->
      <rect x="1075.5" y="667.5" width="119" height="34" rx="4" fill="#0078D7" stroke="#0063B1"/>
      <text x="1135" y="692" text-anchor="middle" font-family="Arial,'Helvetica Neue',sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Continue</text>

      <!-- bottomPanel (FixedSingle) -->
      <rect x="40.5" y="726.5" width="1199" height="33" fill="#FFFFFF" stroke="#A0A0A0"/>
      <text x="48" y="750.5" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="21" fill="#000000">&#169; 2024 Gatelog - Proof of concept</text>
      <text x="1230" y="750.5" text-anchor="end" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="21" fill="#000000">Version : V1R1 (1.0.18)</text>
    </g>
    <rect x="40.5" y="40.5" width="1199" height="719" rx="7.5" fill="none" stroke="#000000" stroke-opacity="0.22"/>
</svg>
