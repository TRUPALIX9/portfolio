<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="csa-t csa-d">
  <title id="csa-t">Card Snap architecture</title>
  <desc id="csa-d">The Expo app captures a business card photo with expo-camera and posts it as base64 over HTTP to the Express 5 API in backend/. The OCR pipeline preprocesses it with sharp, reads text with tesseract.js, extracts fields with compromise and regex, optionally calls the Hugging Face NER API, and returns the fields to prefill the contact form; saved contacts go to MongoDB through Mongoose. A Florence-2 fine-tuning notebook exists as an offline experiment and is not called by the API.</desc>
  <defs>
    <linearGradient id="csa-ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2F8FF"/>
      <stop offset="1" stop-color="#E3EFFB"/>
    </linearGradient>
    <filter id="csa-card" x="-5%" y="-10%" width="110%" height="130%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#004C99" flood-opacity="0.10"/>
    </filter>
    <marker id="csa-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#004C99"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="url(#csa-ground)"/>
    <text x="48" y="64" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#004C99" letter-spacing="3">CARD SNAP / ARCHITECTURE</text>
  <text x="48" y="96" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" fill="#1C1C1C">From a photo of a business card to a saved contact</text>
  <rect x="40" y="124" width="330" height="470" rx="18" fill="#FFFFFF" fill-opacity="0.55" stroke="#C9D9EA" stroke-dasharray="6 5"/><text x="60" y="152" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#004C99" letter-spacing="2">DEVICE</text>
  <rect x="410" y="124" width="470" height="470" rx="18" fill="#FFFFFF" fill-opacity="0.55" stroke="#C9D9EA" stroke-dasharray="6 5"/><text x="430" y="152" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#004C99" letter-spacing="2">SERVER  backend/</text>
  <rect x="920" y="124" width="320" height="470" rx="18" fill="#FFFFFF" fill-opacity="0.55" stroke="#C9D9EA" stroke-dasharray="6 5"/><text x="940" y="152" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#004C99" letter-spacing="2">DATA + CLOUD</text>
  <rect x="60" y="164" width="290" height="250" rx="12" fill="#FFFFFF" stroke="#C9D9EA" filter="url(#csa-card)"/><rect x="60" y="178" width="4" height="222" rx="2" fill="#008BFF"/><text x="80" y="194" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#1C1C1C">Card Snap app</text><text x="80" y="215" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#004C99">Expo SDK 53 · RN 0.79</text><circle cx="84" cy="237.5" r="2.5" fill="#008BFF"/><text x="94" y="242" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#4F5B66">Expo Router tabs: Home, Contacts,</text><circle cx="84" cy="259.5" r="2.5" fill="#008BFF"/><text x="94" y="264" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#4F5B66">  Profile; Add, Scan, Contact Info</text><circle cx="84" cy="281.5" r="2.5" fill="#008BFF"/><text x="94" y="286" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#4F5B66">React Native Paper MD3 themes</text><circle cx="84" cy="303.5" r="2.5" fill="#008BFF"/><text x="94" y="308" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#4F5B66">expo-camera: base64 photo</text><circle cx="84" cy="325.5" r="2.5" fill="#008BFF"/><text x="94" y="330" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#4F5B66">axios / fetch to EXPO_PUBLIC_API_URL</text><circle cx="84" cy="347.5" r="2.5" fill="#008BFF"/><text x="94" y="352" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#4F5B66">AsyncStorage: theme choice only</text>
  <rect x="60" y="434" width="290" height="140" rx="12" fill="#FFFFFF" stroke="#C9D9EA" filter="url(#csa-card)"/><rect x="60" y="448" width="4" height="112" rx="2" fill="#008BFF"/><text x="80" y="464" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#1C1C1C">Review and save</text><text x="80" y="485" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#004C99">app/add/manual</text><circle cx="84" cy="507.5" r="2.5" fill="#008BFF"/><text x="94" y="512" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#4F5B66">Form prefilled from the scan</text><circle cx="84" cy="529.5" r="2.5" fill="#008BFF"/><text x="94" y="534" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#4F5B66">Name, email, company required</text><circle cx="84" cy="551.5" r="2.5" fill="#008BFF"/><text x="94" y="556" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#4F5B66">POST /api/contacts</text>
  <rect x="430" y="164" width="430" height="184" rx="12" fill="#FFFFFF" stroke="#C9D9EA" filter="url(#csa-card)"/><rect x="430" y="178" width="4" height="156" rx="2" fill="#008BFF"/><text x="450" y="194" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#1C1C1C">REST API</text><text x="450" y="215" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#004C99">Express 5 · TypeScript · ts-node · :5091</text><circle cx="454" cy="237.5" r="2.5" fill="#008BFF"/><text x="464" y="242" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#4F5B66">/api/contacts  GET POST  ·  /:id  GET PUT DELETE</text><circle cx="454" cy="259.5" r="2.5" fill="#008BFF"/><text x="464" y="264" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#4F5B66">/api/user/me  GET</text><circle cx="454" cy="281.5" r="2.5" fill="#008BFF"/><text x="464" y="286" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#4F5B66">/api/ocr  ·  /api/ocrExtract  POST {base64}</text><circle cx="454" cy="303.5" r="2.5" fill="#008BFF"/><text x="464" y="308" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#4F5B66">/api/playground/status  (health check)</text>
  <rect x="430" y="368" width="430" height="206" rx="12" fill="#FFFFFF" stroke="#C9D9EA" filter="url(#csa-card)"/><rect x="430" y="382" width="4" height="178" rx="2" fill="#008BFF"/><text x="450" y="398" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#1C1C1C">OCR pipeline</text><text x="450" y="419" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#004C99">controllers/ocrWirhExtractController.ts</text><circle cx="454" cy="441.5" r="2.5" fill="#008BFF"/><text x="464" y="446" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#4F5B66">sharp: rotate, grayscale, resize 1000px, sharpen</text><circle cx="454" cy="463.5" r="2.5" fill="#008BFF"/><text x="464" y="468" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#4F5B66">tesseract.js 6 with eng.traineddata</text><circle cx="454" cy="485.5" r="2.5" fill="#008BFF"/><text x="464" y="490" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#4F5B66">compromise NLP: people, organizations</text><circle cx="454" cy="507.5" r="2.5" fill="#008BFF"/><text x="464" y="512" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#4F5B66">regex: email, phone, labeled name/company</text><circle cx="454" cy="529.5" r="2.5" fill="#008BFF"/><text x="464" y="534" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#4F5B66">Temp PNG in uploads/, deleted after each request</text>
