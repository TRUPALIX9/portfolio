<svg xmlns="http://www.w3.org/2000/svg" width="520" height="1000" viewBox="0 0 520 1000" role="img" aria-labelledby="csk-t csk-d">
  <title id="csk-t">Card Snap: Home in dark mode</title>
  <desc id="csk-d">Recreation of the Card Snap Home tab in its dark MD3 theme inside a phone frame: the app icon, Welcome to Card Snap, the tagline, View Contacts, Add Contact and Profile and Settings buttons, the footer, and the icon-only bottom tabs with Home active.</desc>
  <defs>
