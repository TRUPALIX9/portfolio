      <stop offset="0" stop-color="#0B1824"/>
      <stop offset="1" stop-color="#050B12"/>
    </linearGradient>
    <filter id="csk-drop" x="-20%" y="-10%" width="140%" height="125%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <clipPath id="csk-clip"><rect width="390" height="844" rx="48"/></clipPath>
    <filter id="csk-card" x="-5%" y="-10%" width="110%" height="130%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#004C99" flood-opacity="0.12"/>
    </filter>
    <filter id="csk-fab" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <clipPath id="csk-tile"><rect width="1024" height="1024" rx="204.8"/></clipPath>
    <linearGradient id="csk-grad" gradientUnits="userSpaceOnUse" x1="159" y1="-280" x2="-349" y2="613">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#008BFF"/>
    </linearGradient>
    <mask id="csk-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect x="185" y="267" width="653" height="489" rx="52" fill="#FFFFFF"/>
      <circle cx="403" cy="429.5" r="82" fill="#000000"/>
      <path d="M239 675V646C239 598 318 564 403 564C488 564 566 598 566 646V675Z" fill="#000000"/>
      <rect x="567" y="348" width="217" height="163" rx="12" fill="#000000"/>
      <path d="M594 389L676 441L758 389" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linejoin="round"/>
    </mask>
    <filter id="csk-lift" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000814" flood-opacity="0.45"/>
