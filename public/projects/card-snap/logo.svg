<svg xmlns="http://www.w3.org/2000/svg" width="520" height="160" viewBox="0 0 520 160" role="img" aria-labelledby="csl-t csl-d">
  <title id="csl-t">Card Snap</title>
  <desc id="csl-d">Card Snap logo: the app icon mark (business card with person and envelope on a blue-to-black gradient) beside the wordmark Card Snap.</desc>
  <defs>
    <style>
      .csl-word{fill:#1C1C1C}
      .csl-snap{fill:#008BFF}
      @media (prefers-color-scheme: dark){ .csl-word{fill:#E0E0E0} }
    </style>
    <linearGradient id="csl-grad" gradientUnits="userSpaceOnUse" x1="159" y1="-280" x2="-349" y2="613">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#008BFF"/>
    </linearGradient>
    <mask id="csl-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect x="185" y="267" width="653" height="489" rx="52" fill="#FFFFFF"/>
      <circle cx="403" cy="429.5" r="82" fill="#000000"/>
      <path d="M239 675V646C239 598 318 564 403 564C488 564 566 598 566 646V675Z" fill="#000000"/>
      <rect x="567" y="348" width="217" height="163" rx="12" fill="#000000"/>
      <path d="M594 389L676 441L758 389" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linejoin="round"/>
    </mask>
    <filter id="csl-lift" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000814" flood-opacity="0.45"/>
    </filter>
    <clipPath id="csl-tile"><rect width="1024" height="1024" rx="230"/></clipPath>
  </defs>
  <g transform="translate(16 16) scale(0.125)">
    <g clip-path="url(#csl-tile)">
      <rect width="1024" height="1024" fill="url(#csl-grad)"/>
      <g filter="url(#csl-lift)"><rect x="185" y="267" width="653" height="489" fill="#FFFCFC" mask="url(#csl-cut)"/></g>
    </g>
  </g>
  <text x="166" y="103" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="64" font-weight="700" letter-spacing="-1"><tspan class="csl-word">Card</tspan> <tspan class="csl-snap">Snap</tspan></text>
</svg>
