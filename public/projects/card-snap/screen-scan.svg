      <stop offset="0" stop-color="#F2F8FF"/>
      <stop offset="1" stop-color="#E3EFFB"/>
    </linearGradient>
    <filter id="css-drop" x="-20%" y="-10%" width="140%" height="125%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#00284D" flood-opacity="0.22"/>
    </filter>
    <clipPath id="css-clip"><rect width="390" height="844" rx="48"/></clipPath>
