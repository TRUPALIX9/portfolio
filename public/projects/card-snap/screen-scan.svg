      <stop offset="0.55" stop-color="#5E432F"/>
      <stop offset="1" stop-color="#3E2B1E"/>
    </linearGradient>
    <radialGradient id="css-vig" cx="195" cy="420" r="470" gradientUnits="userSpaceOnUse">
      <stop offset="0.45" stop-color="#000000" stop-opacity="0"/>
