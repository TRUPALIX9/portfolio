    <radialGradient id="css-light" cx="150" cy="250" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE9C9" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFE9C9" stop-opacity="0"/>
    </radialGradient>
    <filter id="css-paper" x="-20%" y="-25%" width="140%" height="160%" color-interpolation-filters="sRGB">
