  <title id="css-t">Card Snap: Scan Business Card</title>
  <desc id="css-d">Recreation of the Card Snap scan screen inside a phone frame: the Scan Business Card header with a back chevron above the live camera view, which shows a fictional business card for Maya Chen of Harbor and Pine Supply on a desk, a camera-flip button and the round blue shutter.</desc>
