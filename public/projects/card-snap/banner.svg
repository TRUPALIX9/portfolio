<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="csb-t csb-d">
  <title id="csb-t">Card Snap</title>
  <desc id="csb-d">Card Snap banner: the app icon, the name, the tagline Scan business cards. Store and search your contacts., stack chips, and the Contacts tab in a phone frame on a blue-to-black gradient.</desc>
  <defs>
    <linearGradient id="csb-ground" gradientUnits="userSpaceOnUse" x1="1280" y1="0" x2="0" y2="640">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.55" stop-color="#021628"/>
      <stop offset="1" stop-color="#00427D"/>
    </linearGradient>
    <radialGradient id="csb-glow" gradientUnits="userSpaceOnUse" cx="944" cy="360" r="360">
      <stop offset="0" stop-color="#008BFF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#008BFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="csb-drop" x="-25%" y="-10%" width="150%" height="125%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="csb-paper" x="-20%" y="-30%" width="140%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="csb-tile"><rect width="1024" height="1024" rx="230"/></clipPath>
    <linearGradient id="csb-grad" gradientUnits="userSpaceOnUse" x1="159" y1="-280" x2="-349" y2="613">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#008BFF"/>
    </linearGradient>
    <mask id="csb-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect x="185" y="267" width="653" height="489" rx="52" fill="#FFFFFF"/>
      <circle cx="403" cy="429.5" r="82" fill="#000000"/>
      <path d="M239 675V646C239 598 318 564 403 564C488 564 566 598 566 646V675Z" fill="#000000"/>
      <rect x="567" y="348" width="217" height="163" rx="12" fill="#000000"/>
      <path d="M594 389L676 441L758 389" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linejoin="round"/>
    </mask>
    <filter id="csb-lift" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000814" flood-opacity="0.45"/>
    </filter>
    <clipPath id="csb-clip"><rect width="390" height="844" rx="48"/></clipPath>
    <filter id="csb-card" x="-5%" y="-10%" width="110%" height="130%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#004C99" flood-opacity="0.12"/>
    </filter>
    <filter id="csb-fab" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

